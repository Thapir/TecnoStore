<div class="flex align-items-center justify-content-center min-h-screen surface-50 px-4 py-6">
  <div class="surface-card border-round shadow-2 p-5 w-full" style="max-width: 420px;">
    <div class="text-center mb-5">
      <h1 class="text-3xl font-bold text-primary mb-2">
        <i class="pi pi-shopping-bag mr-2"></i>TecnoStore
      </h1>
      <h2 class="text-xl font-semibold mb-1">Bienvenido de Nuevo</h2>
      <p class="text-gray-500">Inicia sesión en tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block font-semibold mb-2">Email</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope"></i>
          <input type="email" pInputText formControlName="email" placeholder="demo@example.com"
                 class="w-full" [class.ng-invalid]="isInvalid('email')" [class.ng-dirty]="isInvalid('email')">
        </span>
        <small *ngIf="isInvalid('email')" class="p-error">Se requiere un email válido</small>
      </div>

      <div class="mb-4">
        <label class="block font-semibold mb-2">Contraseña</label>
        <p-password formControlName="password" [toggleMask]="true" [feedback]="false"
                    placeholder="demo123" styleClass="w-full"
                    inputStyleClass="w-full"></p-password>
        <small *ngIf="isInvalid('password')" class="p-error">La contraseña es obligatoria</small>
      </div>

      <div class="flex align-items-center justify-content-between mb-4">
        <div class="flex align-items-center">
          <p-checkbox formControlName="remember" [binary]="true" inputId="remember"></p-checkbox>
          <label for="remember" class="ml-2 text-sm">Recordarme</label>
        </div>
        <a class="text-primary text-sm cursor-pointer no-underline">¿Olvidaste tu contraseña?</a>
      </div>

      <p-button type="submit" label="Iniciar Sesión" icon="pi pi-sign-in"
                styleClass="w-full p-button-lg" [loading]="loading"></p-button>
    </form>

    <p-divider align="center"><span class="text-gray-400 text-sm">O</span></p-divider>

    <p-button label="Iniciar sesión con Google" icon="pi pi-google" [outlined]="true"
              styleClass="w-full mb-2" [disabled]="true"></p-button>

    <div class="text-center mt-4">
      <span class="text-gray-500">¿No tienes cuenta? </span>
      <a routerLink="/auth/register" class="text-primary font-semibold no-underline cursor-pointer">Registrate</a>
    </div>

    <div class="text-center mt-3 surface-50 border-round p-2">
      <small class="text-gray-400">Demo: demo&#64;example.com / demo123</small>
    </div>
  </div>
</div>
