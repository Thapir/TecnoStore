<div class="header-container" [class.is-scrolled]="scrolled">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-bar-inner">
      <span class="top-bar-item"><i class="pi pi-truck"></i>Envío gratis en compras mayores a $100</span>
      <span class="top-bar-item top-bar-item--muted"><i class="pi pi-phone"></i>Soporte: +1 (555) 123-4567</span>
    </div>
  </div>

  <!-- Main header -->
  <div class="main-header">
    <div class="main-header-inner max-w-screen-xl mx-auto">
      <!-- Logo -->
      <a routerLink="/" class="brand no-underline">
        <span class="brand-mark">
          <i class="pi pi-shopping-bag"></i>
        </span>
        <span class="brand-name">TecnoStore</span>
      </a>

      <!-- Search bar (desktop) -->
      <div class="search-bar hidden md:flex">
        <div class="search-field">
          <i class="pi pi-search search-icon"></i>
          <input type="text" placeholder="Buscar productos, marcas, categorías..."
                 class="search-input" [(ngModel)]="searchQuery"
                 (keyup.enter)="onSearch()">
          <button type="button" class="search-submit" (click)="onSearch()"
                  [disabled]="!searchQuery.trim()">
            Buscar
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <!-- User -->
        <ng-container *ngIf="currentUser; else loginBtn">
          <button type="button" class="icon-btn" (click)="userMenu.toggle($event)"
                  pTooltip="Mi cuenta" tooltipPosition="bottom">
            <i class="pi pi-user"></i>
          </button>
          <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
        </ng-container>
        <ng-template #loginBtn>
          <a routerLink="/auth/login" class="icon-btn" pTooltip="Iniciar sesión"
             tooltipPosition="bottom">
            <i class="pi pi-sign-in"></i>
          </a>
        </ng-template>

        <!-- Cart -->
        <button type="button" class="icon-btn cart-btn" (click)="goToCart()"
                pTooltip="Carrito" tooltipPosition="bottom">
          <i class="pi pi-shopping-cart"></i>
          <span *ngIf="cartItemCount > 0" class="cart-badge">{{ cartItemCount }}</span>
        </button>

        <!-- Mobile menu toggle -->
        <button type="button" class="icon-btn mobile-toggle md:hidden"
                (click)="mobileMenuVisible = true">
          <i class="pi pi-bars"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Navigation bar (desktop) -->
  <nav class="nav-bar hidden md:block">
    <div class="nav-bar-inner max-w-screen-xl mx-auto">
      <a *ngFor="let item of menuItems" [routerLink]="item.routerLink"
         [queryParams]="item.queryParams"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ exact: !item.queryParams }"
         class="nav-link">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </div>
  </nav>

  <!-- Mobile sidebar -->
  <p-sidebar [(visible)]="mobileMenuVisible" position="left" styleClass="mobile-sidebar">
    <ng-template pTemplate="header">
      <span class="brand">
        <span class="brand-mark"><i class="pi pi-shopping-bag"></i></span>
        <span class="brand-name">TecnoStore</span>
      </span>
    </ng-template>

    <!-- Mobile search -->
    <div class="search-field mb-4">
      <i class="pi pi-search search-icon"></i>
      <input type="text" placeholder="Buscar..."
             class="search-input" [(ngModel)]="searchQuery"
             (keyup.enter)="onSearch(); mobileMenuVisible = false">
    </div>

    <div class="mobile-nav">
      <a *ngFor="let item of menuItems" [routerLink]="item.routerLink"
         [queryParams]="item.queryParams"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ exact: !item.queryParams }"
         class="mobile-nav-link"
         (click)="mobileMenuVisible = false">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
        <i class="pi pi-angle-right ml-auto"></i>
      </a>
    </div>
  </p-sidebar>
</div>
