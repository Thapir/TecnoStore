<div class="flex align-items-center justify-content-center min-h-screen surface-50 px-4 py-6">
  <div class="surface-card border-round shadow-2 p-5 w-full" style="max-width: 420px;">
    <div class="text-center mb-5">
      <h1 class="text-3xl font-bold text-primary mb-2">
        <i class="pi pi-shopping-bag mr-2"></i>TecnoStore
      </h1>
      <h2 class="text-xl font-semibold mb-1">Crear Cuenta</h2>
      <p class="text-gray-500">Únete y empieza a comprar</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="grid">
        <div class="col-6 mb-3">
          <label class="block font-semibold mb-2">Nombre</label>
          <input type="text" pInputText formControlName="firstName" class="w-full"
                 [class.ng-invalid]="isInvalid('firstName')" [class.ng-dirty]="isInvalid('firstName')">
        </div>
        <div class="col-6 mb-3">
          <label class="block font-semibold mb-2">Apellido</label>
          <input type="text" pInputText formControlName="lastName" class="w-full"
                 [class.ng-invalid]="isInvalid('lastName')" [class.ng-dirty]="isInvalid('lastName')">
        </div>
      </div>

      <div class="mb-3">
        <label class="block font-semibold mb-2">Email</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope"></i>
          <input type="email" pInputText formControlName="email" placeholder="tu@email.com"
                 class="w-full" [class.ng-invalid]="isInvalid('email')" [class.ng-dirty]="isInvalid('email')">
        </span>
        <small *ngIf="isInvalid('email')" class="p-error">Se requiere un email válido</small>
      </div>

      <div class="mb-3">
        <label class="block font-semibold mb-2">Contraseña</label>
        <p-password formControlName="password" [toggleMask]="true"
                    placeholder="Mín. 6 caracteres" styleClass="w-full"
                    inputStyleClass="w-full"></p-password>
        <small *ngIf="isInvalid('password')" class="p-error">Se requieren mín. 6 caracteres</small>
      </div>

      <div class="flex align-items-center mb-4">
        <p-checkbox formControlName="acceptTerms" [binary]="true" inputId="terms"></p-checkbox>
        <label for="terms" class="ml-2 text-sm">
          Acepto los <a class="text-primary cursor-pointer no-underline">Términos de Servicio</a>
          y la <a class="text-primary cursor-pointer no-underline">Política de Privacidad</a>
        </label>
      </div>

      <p-button type="submit" label="Crear Cuenta" icon="pi pi-user-plus"
                styleClass="w-full p-button-lg" [loading]="loading"></p-button>
    </form>

    <p-divider align="center"><span class="text-gray-400 text-sm">O</span></p-divider>

    <p-button label="Registrarse con Google" icon="pi pi-google" [outlined]="true"
              styleClass="w-full mb-2" [disabled]="true"></p-button>

    <div class="text-center mt-4">
      <span class="text-gray-500">¿Ya tienes cuenta? </span>
      <a routerLink="/auth/login" class="text-primary font-semibold no-underline cursor-pointer">Iniciar Sesión</a>
    </div>
  </div>
</div>
